name: pipeline

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python syntax lint
        run: python -m py_compile app.py

      - name: Unit tests
        run: python -m unittest -v tests_app.py

      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dockerfile-hello:ci .

      - name: Export image artifact
        run: docker save dockerfile-hello:ci -o dockerfile-hello-ci.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockerfile-hello-image
          path: dockerfile-hello-ci.tar
          retention-days: 1

  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: dockerfile-hello-image

      - name: Load image
        run: docker load -i dockerfile-hello-ci.tar

      - name: Run container
        run: docker run -d --rm -p 8000:8000 --name dockerfile-hello-ci dockerfile-hello:ci

      - name: Curl /health and /version
        run: |
          for i in {1..12}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:8000/version >/dev/null; then
              echo "Smoke check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Smoke check failed"
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f dockerfile-hello-ci

  trivy:
    name: Optional Trivy scan (soft-fail)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: smoke
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dockerfile-hello:scan .

      - name: Run Trivy scan (soft-fail)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: dockerfile-hello:scan
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
