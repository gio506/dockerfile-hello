name: pipeline

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python syntax lint
        run: python -m py_compile app.py

      - name: Dockerfile lint (hadolint if available; fallback checks)
        run: |
          if command -v hadolint >/dev/null 2>&1; then
            hadolint Dockerfile
          else
            grep -q '^FROM ' Dockerfile
            grep -q '^USER ' Dockerfile
            grep -q '^HEALTHCHECK ' Dockerfile
            echo "hadolint not found; basic Dockerfile checks passed"
          fi

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dockerfile-hello:ci .

  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dockerfile-hello:ci .

      - name: Run container
        run: docker run -d --rm -p 8000:8000 --name dockerfile-hello-ci dockerfile-hello:ci

      - name: Curl /health and /version
        run: |
          for i in {1..12}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:8000/version >/dev/null; then
              echo "Smoke check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Smoke check failed"
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f dockerfile-hello-ci

  trivy:
    name: Optional Trivy scan (soft-fail)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: smoke
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dockerfile-hello:scan .

      - name: Run Trivy scan (soft-fail)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 1 dockerfile-hello:scan || true
