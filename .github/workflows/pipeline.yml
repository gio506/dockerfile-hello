name: pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structure-check:
    name: Structure check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          required_files=(
            "README.md"
            "CHEATSHEET.md"
            "FILES_EXPLAINED.md"
            "app.py"
            "Dockerfile"
            "Makefile"
            "requirements.txt"
            "tests/test_app.py"
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "Missing required file: $file"
              exit 1
            }
          done

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    needs: structure-check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python syntax lint
        run: python -m py_compile app.py

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: python-lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run markdownlint
        run: |
          npm install --global markdownlint-cli
          markdownlint "**/*.md"

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: markdown-lint
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dockerfile-hello:ci .

      - name: Export image artifact
        run: docker save dockerfile-hello:ci -o dockerfile-hello-ci.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockerfile-hello-image
          path: dockerfile-hello-ci.tar
          retention-days: 1

  container-smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: dockerfile-hello-image

      - name: Load image
        run: docker load -i dockerfile-hello-ci.tar

      - name: Run container
        run: docker run -d --rm -p 8000:8000 --name dockerfile-hello-ci dockerfile-hello:ci

      - name: Curl /health and /version
        run: |
          for i in {1..12}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:8000/version >/dev/null; then
              echo "Smoke check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Smoke check failed"
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f dockerfile-hello-ci

  trivy:
    name: Trivy security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: container-smoke
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dockerfile-hello:scan .

      - name: Run Trivy scan report
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.1 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --exit-code 0 \
            dockerfile-hello:scan
